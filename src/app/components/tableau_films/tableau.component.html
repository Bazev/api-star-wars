<div class="tableau-container">
  <h6>{{films.length === 1 ? 'Film' : 'Films'}} où apparaît {{hero?.name}}</h6>

  <table *ngIf="films && films.length > 0" class="table table-striped">
    <thead>
      <tr>
        <th>Episode</th>
        <th>Titre</th>
        <th>Date de sortie</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let film of films">
        <td>{{film.episode_id}}</td>
        <td>{{film.title}}</td>
        <td>{{film.release_date}}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!films || films.length === 0" class="text-muted">Aucun film trouvé</p>
</div>
